<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control — PangoT</title>
<meta name="theme-color" content="#1B2C31">
<link rel="icon" href="/static/icon-192.png">
<!-- Leaflet is vendored rather than loaded from a CDN. The dashboard failed
     completely whenever unpkg was unreachable, which on a restricted field
     network is not a rare event. See static/vendor/leaflet/LICENSE. -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<header class="top">
  <h1>PangoT Mission Control</h1>
  <button type="button" class="linkbtn" id="refresh">Refresh</button>
  <button type="button" class="linkbtn" id="zoom-all">Zoom to all</button>
  <a class="linkbtn" href="/download_fixes">Fixes CSV</a>
  <a class="linkbtn" href="/download_csv">Bearings CSV</a>
  <a class="linkbtn" href="/">Field app</a>
  <form method="post" action="/logout" style="margin:0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="linkbtn">Sign out</button>
  </form>
</header>

<div class="filters">
  <div class="group">
    <label for="filter-animal">Animal</label>
    <select id="filter-animal"><option value="all">All</option></select>
  </div>
  <div class="group">
    <label for="filter-observer">Observer</label>
    <select id="filter-observer"><option value="all">All</option></select>
  </div>
  <div class="group">
    <label for="filter-quality">Quality</label>
    <select id="filter-quality">
      <option value="all">All</option>
      <option value="good">Good</option>
      <option value="fair">Fair</option>
      <option value="poor">Poor</option>
      <option value="unknown">Unknown</option>
    </select>
  </div>
  <div class="group">
    <label for="filter-date">Date</label>
    <input type="date" id="filter-date">
  </div>
  <button type="button" class="linkbtn" id="filter-clear"
          style="border-color:var(--line-firm);background:var(--surface);color:var(--ink);align-self:flex-end">
    Clear
  </button>
  <div class="spacer"></div>
  <div class="status" id="status">Loading…</div>
</div>

<div class="banner" id="banner" hidden></div>

<div class="content">
  <div id="map"></div>
  <aside class="sidebar">
    <h2>Current fixes</h2>
    <div id="fix-list"></div>
  </aside>
</div>

<div class="toast" id="toast" hidden>
  <span id="toast-text"></span>
  <button type="button" id="toast-undo">Undo</button>
</div>

<dialog id="edit-dialog">
  <div class="dialog-body">
    <h2>Edit fix</h2>
    <div class="field">
      <label for="edit-animal">Animal ID</label>
      <input type="text" id="edit-animal" maxlength="16">
    </div>
    <div class="field">
      <label for="edit-note">Note</label>
      <input type="text" id="edit-note" maxlength="255">
    </div>
    <div class="msg error" id="edit-error" hidden></div>
    <div class="btn-row" style="margin-top:14px">
      <button type="button" class="btn btn-quiet" id="edit-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="edit-save">Save</button>
    </div>
  </div>
</dialog>

<script>
  // Passed as JSON rather than interpolated into JavaScript source, so a value
  // containing a quote cannot break the script.
  window.PANGOT_CONFIG = {
    mapboxToken: {{ mapbox_token | tojson }},
    csrfToken: {{ csrf_token() | tojson }}
  };
</script>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
